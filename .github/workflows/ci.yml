name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"

      - name: Install Ruff
        run: pip install ruff==0.15.22

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
